# Vultr VPS: docker compose -f docker-compose.vultr.yml up -d --build
services:
  dp-capture:
    build: .
    image: dp-capture:latest
    container_name: dp-capture
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - /etc/dp-capture.env
    environment:
      DP_REPO_ROOT: /app
      DP_CAPTURE_TIMEOUT_MS: "90000"
